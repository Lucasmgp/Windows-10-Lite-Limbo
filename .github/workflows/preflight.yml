name: Preflight - Windows 10 Lite Limbo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Verificar ambiente Windows
    runs-on: windows-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Identificar ambiente
        shell: pwsh
        run: |
          Write-Host "Windows runner pronto para as etapas de inventario."
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
          Get-PSDrive -Name C | Select-Object Name, Used, Free

      - name: Verificar DISM
        shell: pwsh
        run: |
          $dism = Get-Command dism.exe -ErrorAction Stop
          Write-Host "DISM encontrado: $($dism.Source)"
          $output = & $dism.Source /English /Get-CurrentEdition 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "DISM retornou codigo de erro: $exitCode"
          }
          Write-Host "DISM respondeu corretamente." -ForegroundColor Green

      - name: Registrar estrutura do projeto
        shell: pwsh
        run: |
          Get-ChildItem -Force
          Get-ChildItem -Recurse scripts, config
          Write-Host "Preflight concluido. Nenhuma ISO foi baixada ou modificada."
